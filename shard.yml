name: crystal-deploy
version: 0.1.1

description: >
  Shard Crystal pour le déploiement d'applications Marten et Kemal sur FreeBSD.
  Style Capistrano : releases/, current/, shared/.
  Génère dynamiquement les scripts rc.d et nginx.conf.

authors:
  - ALOLI sas <philippe@aloli.fr>

crystal: ">= 1.19.1"

license: MIT

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"

targets:
  deploy:
    main: src/deploy.cr

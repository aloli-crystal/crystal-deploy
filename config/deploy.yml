# =============================================================================
# config/deploy.yml — Configuration du déploiement
# Copiez ce fichier dans votre projet Crystal et adaptez-le.
# =============================================================================

# Nom de l'application (utilisé pour les répertoires, services, binaires)
app_name: mon-app

# Dépôt Git source
repo_url: git@github.com:user/mon-app.git

# Fichier source Crystal principal (relatif à la racine du projet)
crystal_main: src/mon_app.cr

# Flags de compilation Crystal supplémentaires (optionnel)
# crystal_flags: "-D use_pg"

# Nombre de releases à conserver
keep_releases: 10

# Framework Crystal utilisé : marten | kemal (défaut : kemal)
# Adapte : variables .env, chemins assets NGINX, migrations, workflow CI
framework: marten

# Environnements de déploiement
environments:
  developpement:
    branch: developpement
    host: deploy.example.com
    user: deploy
    app_url: https://dev.mon-app.example.app
    dns_subdomain: dev.mon-app
    dns_target: deploy.example.com.

  preproduction:
    branch: developpement
    host: deploy.example.com
    user: deploy
    app_url: https://preprod.mon-app.example.app
    dns_subdomain: preprod.mon-app
    dns_target: deploy.example.com.

  production:
    branch: production
    host: prod.example.com
    user: deploy
    app_url: https://mon-app.example.app
    dns_subdomain: mon-app
    dns_target: prod.example.com.

# =============================================================================
# Variables d'environnement demandées lors du dialogue `deploy init`
#
# Chaque entrée :
#   key          : nom de la variable dans le .env
#   label        : question affichée à l'utilisateur
#   default_from : valeur par défaut tirée de l'environnement courant
#                  (app_url | socket_path)
#   generate     : génération automatique si vide (hex32 | base64_20)
#   build_from_pg: true → dialogue PostgreSQL dédié (host, user, pass, db, socket)
#   optional     : true → la variable peut être laissée vide
#   secret       : true → la saisie est masquée
# =============================================================================

# --- Exemple pour framework: marten ---
env_vars:
  - key: SECRET_KEY
    label: "Clé secrète de l'application (laisser vide pour générer)"
    generate: hex32

  # MARTEN_ENV, MARTEN_ALLOWED_HOSTS et MARTEN_SOCKET sont injectés automatiquement
  # depuis l'environnement choisi (--preproduction, --production, etc.) et app_url.
  # Ne pas les déclarer ici.

  # PostgreSQL — le dialogue dédié demande : hôte OU socket Unix, port, utilisateur,
  # mot de passe, nom de la base. Les variables DB_* sont construites automatiquement.
  - key: DB_HOST
    label: "Connexion PostgreSQL"
    build_from_pg: true

  - key: SMTP_HOST
    label: "Serveur SMTP (ex: smtp.example.com)"
    optional: true

  - key: SMTP_PORT
    label: "Port SMTP (ex: 587)"
    optional: true

  - key: SMTP_USER
    label: "Utilisateur SMTP"
    optional: true

  - key: SMTP_PASSWORD
    label: "Mot de passe SMTP"
    optional: true
    secret: true

  - key: EMAIL_FROM
    label: "Adresse email expéditeur (ex: noreply@mon-app.example.app)"
    optional: true

  - key: STRIPE_SECRET_KEY
    label: "Clé secrète Stripe (ex: sk_live_...)"
    optional: true
    secret: true

  - key: STRIPE_PUBLISHABLE_KEY
    label: "Clé publique Stripe (ex: pk_live_...)"
    optional: true

  - key: STRIPE_WEBHOOK_SECRET
    label: "Secret webhook Stripe (ex: whsec_...)"
    optional: true
    secret: true

# --- Exemple pour framework: kemal (décommenter et remplacer la section env_vars) ---

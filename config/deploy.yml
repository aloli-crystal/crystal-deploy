# Configuration OVH DNS (optionnel)
# Les clés API OVH sont stockées dans le .env local (non versionné).
# Utilisez `bin/deploy ovh-setup` pour les générer.
ovh:
  dns_zone: example.app
  api_url: https://eu.api.ovh.com/1.0
